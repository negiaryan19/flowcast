[build-system]
requires = ["setuptools>=78"]
build-backend = "setuptools.build_meta"

[project]
name = "flowcast"
version = "0.1.0"
description = "Traffic volume forecasting API and 3D dashboard"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.123.10",
  "joblib==1.5.2",
  "pandas==2.3.3",
  "scikit-learn==1.7.2",
  "uvicorn[standard]==0.38.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==9.0.1",
  "ruff==0.14.6",
]

[tool.setuptools.packages.find]
include = ["api*", "ml*", "utils*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
